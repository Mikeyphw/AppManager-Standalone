name: "CodeQL"

on:
  workflow_dispatch: {}
  push:
    branches: [ "master", "AppManager-*", "feature/amui-installer-original-apk-port-20261118" ]
  pull_request:
    branches: [ "master", "feature/tasker-automation" ]
  schedule:
    - cron: '43 14 * * 4'

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: 'recursive'
      - name: Verify checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      # Compile for CodeQL without requesting an unsigned release APK.
      - name: Compile Android debug Java sources for CodeQL
        run: ./gradlew --no-daemon :app:compileDebugJavaWithJavac
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

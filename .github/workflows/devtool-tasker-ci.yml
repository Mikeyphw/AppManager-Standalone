name: Devtool Tasker integration / hosted Android

"on":
  workflow_dispatch:
    inputs:
      mode:
        description: 'Hosted Gradle task group'
        required: true
        default: source
        type: choice
        options: [source, build, test, lint, instrumentation, full]

permissions:
  contents: read

concurrency:
  group: tasker-devtool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    name: Devtool source contract and upstream merge safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source checks (no Gradle)
        run: |
          python3 scripts/devtool/check_contract.py --check
          python3 scripts/devtool/check_automation_contract.py --check
          python3 scripts/devtool/check_amt03_contract.py --check
          python3 scripts/devtool/check_amt04_contract.py --check
          python3 scripts/devtool/check_amt04b_contract.py --check
          python3 scripts/devtool/check_amt04b2_contract.py --check
          python3 scripts/devtool/check_amt04b2b_contract.py --check
          python3 scripts/devtool/check_amt05a_contract.py --check
          python3 scripts/devtool/check_amt05b_contract.py --check
          python3 scripts/devtool/check_amt05c_contract.py --check
          python3 scripts/devtool/check_amui03b_hf03_contracts.py --check
          python3 scripts/devtool/check_amui03c_consolidated.py --check
          python3 scripts/devtool/check_amui04a_visual_gate.py --check
          python3 scripts/devtool/check_amui04b_viewport_stress.py --check
          python3 scripts/devtool/check_amui04c_refresh_races.py --check
          python3 scripts/devtool/check_amui04d_final_gate.py --check
          python3 scripts/devtool/check_amui05_acceptance.py --check
          python3 scripts/devtool/check_amt05d_contract.py --check
          python3 scripts/devtool/check_amt06a_contract.py --check
          python3 scripts/devtool/check_amt06b_contract.py --check
          python3 scripts/devtool/check_amt06c_contract.py --check
          python3 scripts/devtool/check_amui01_contract.py --check
          python3 scripts/devtool/check_amui01_backup_hf05.py --check
          python3 scripts/devtool/check_amui01_hf08_lint.py --check
          python3 scripts/devtool/check_amui01_hf09_kvm.py --check
          python3 scripts/devtool/check_amui02_theme.py --check
          python3 -m unittest discover -s scripts/devtool -p 'test_*.py' -v
          sh -n devtoolw
      - name: Verify upstream merge compatibility without changing the tree
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/MuntashirAkon/AppManager.git
          git fetch --no-tags upstream master
          git merge-tree --write-tree HEAD upstream/master > "$RUNNER_TEMP/appmanager-upstream-merge-tree.txt"
          echo 'Upstream merge-tree calculation succeeded.'
      - name: Install exact Devtool source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Validate native Devtool configuration, wrapper, and seal
        shell: bash
        run: |
          set -euo pipefail
          devtool --repo "$PWD" config resolve > "$RUNNER_TEMP/devtool-config.json"
          devtool --repo "$PWD" wrapper verify
          devtool --repo "$PWD" wrapper seal
          ./devtoolw source-check

  hosted-android:
    name: Android Gradle through Devtool (GitHub-hosted only)
    needs: [source-contract]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode != 'source' && inputs.mode != 'instrumentation') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'cmake;3.22.1'
      - name: Install exact Devtool source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Devtool Android action / workflow execution
        shell: bash
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'full' || (github.event_name == 'push' && 'full') || inputs.mode || 'source' }}
        run: |
          set -euo pipefail
          : "${JAVA_HOME:?GitHub setup-java must expose JAVA_HOME}"
          test -x "$JAVA_HOME/bin/java"
          "$JAVA_HOME/bin/java" -version
          devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app inspect
          # Lint legacy issue snapshot is pinned to run 42255012506 and is
          # checked against the *fresh* lint XML. No global lint suppression.
          # Devtool performs the Gradle work; historical upstream lint findings
          # are acknowledged only when they exactly match the frozen snapshot.
          run_guarded_devtool() {
            local mode="$1"
            shift
            local xml="app/build/reports/lint-results-debug.xml"
            local log="$RUNNER_TEMP/appmanager-devtool-${mode}.log"
            rm -f -- "$xml"
            set +e
            "$@" 2>&1 | tee "$log"
            local devtool_rc="${PIPESTATUS[0]}"
            set -e
            # Missing report or any new lint error fails closed.
            python3 scripts/devtool/check_upstream_lint_baseline.py --report "$xml" --summary "$GITHUB_STEP_SUMMARY"
            # Never waive an actual Gradle failure; the known Devtool reporting
            # failure is distinct from Gradle's successful lintDebug task.
            # Ensure lint itself (not an earlier build/test task) succeeded.
            if ! awk '
              /> Task :app:lintDebug/ { saw_lint=1; lint_ok=0 }
              saw_lint && /Gradle result: success/ { lint_ok=1 }
              END { exit !(saw_lint && lint_ok) }
            ' "$log"; then
              echo 'No successful hosted lintDebug execution; refusing legacy waiver' >&2
              return 1
            fi
            if [[ "$mode" == full ]]; then
              if ! grep -Eq 'Build[[:space:]]+Done' "$log" ||                  ! grep -Eq 'Run tests[[:space:]]+Done' "$log"; then
                echo 'Hosted build/test stage did not complete; refusing legacy waiver' >&2
                return 1
              fi
            fi
            if (( devtool_rc != 0 )); then
              echo '::warning::Devtool classified accepted upstream lint debt as failure; no new errors were found.'
            fi
          }
          case "$MODE" in
            build) devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app build ;;
            test)  devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app test ;;
            lint)  run_guarded_devtool lint devtool --repo "$PWD" --java-home "$JAVA_HOME" --target app lint ;;
            full)  run_guarded_devtool full devtool --repo "$PWD" --java-home "$JAVA_HOME" invoke --target app ci ;;
            *)     echo "Unsupported mode: $MODE" >&2; exit 2 ;;
          esac
      - name: Produce checksum manifest of debug APKs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            find app/build/outputs/apk/debug -type f -name '*.apk' -print0 | sort -z | xargs -0 sha256sum > devtool-apk-sha256.txt
          fi
      - name: Upload debug APKs and integrity manifest (not release-signed)
        if: always() && (inputs.mode == 'build' || inputs.mode == 'full' || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01')))
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-devtool-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/debug/**/*.apk
            devtool-apk-sha256.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit-test XML and detailed HTML (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/test-results/testDebugUnitTest/**/*.xml
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload hosted Android lint report and baseline audit
        if: always() && (inputs.mode == 'lint' || inputs.mode == 'full' || github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01')))
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-lint-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/lint-results-debug.xml
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7


  device-instrumentation:
    name: AMT-03 Android instrumentation via Devtool emulator
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == 'instrumentation') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install hosted Android SDK and pinned Devtool
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'cmake;3.22.1' 'ndk;27.0.12077973'
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Enable KVM acceleration for AMT-03 instrumentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::No /dev/kvm device on this hosted runner; refusing unaccelerated x86_64 emulator.' >&2
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo '::error::KVM device is still inaccessible; refusing software-emulated Android boot.' >&2
            exit 1
          fi
          echo AMT03_HF03_KVM_READY
      - name: Run journal device instrumentation (no real profiles modified)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash scripts/devtool/amt03_hosted_instrumentation.sh && bash scripts/devtool/amui01_hosted_instrumentation.sh && bash scripts/devtool/amui02_hosted_theme.sh
      - name: Upload instrumentation receipt and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-amt03-instrumentation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/amt03-instrumentation.json
            ${{ runner.temp }}/amt03-instrumentation.log
            ${{ runner.temp }}/amui01-*.json
            ${{ runner.temp }}/amui01-fixture.sha256
            ${{ runner.temp }}/amui02-*.json
            ${{ runner.temp }}/amui03c-ui-*.json
            ${{ runner.temp }}/amui03c-ui-*.log
            ${{ runner.temp }}/amui04a-api*.json
            ${{ runner.temp }}/amui04a-api*.log
            ${{ runner.temp }}/amui04a-screenshots-api*/**
            ${{ runner.temp }}/amui04a-screenshots-api*.sha256
            ${{ runner.temp }}/amui04b-api*.json
            ${{ runner.temp }}/amui04b-api*.log
            ${{ runner.temp }}/amui04b-screenshots-api*/**
            ${{ runner.temp }}/amui04b-screenshots-api*.sha256
            ${{ runner.temp }}/amui04c-api*.json
            ${{ runner.temp }}/amui04c-api*.log
            ${{ runner.temp }}/amui04d-api*.json
            ${{ runner.temp }}/amui04d-api*.log
            ${{ runner.temp }}/amui01-*.log
          if-no-files-found: warn
          retention-days: 7

  amt06c-fixture:
    name: AMT-06C disposable debug fixture (hosted only)
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'build' || inputs.mode == 'full') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install pinned Android SDK for fixture
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools'
      - name: Build opt-in disposable debug-only fixture
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -Pamt06cFixture=true :amt06cfixture:assembleDebug
          shopt -s nullglob
          apks=(scripts/devtool/amt06c_fixture/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$apk" | grep -F "package: name='dev.mikeyphw.amt06c.fixture'"
          sha256sum "$apk" > scripts/devtool/amt06c_fixture/SHA256SUMS.txt
      - name: Publish disposable fixture APK and digest (not release signed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-amt06c-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/devtool/amt06c_fixture/build/outputs/apk/debug/*.apk
            scripts/devtool/amt06c_fixture/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  amui01-android16:
    name: AMUI-01 real package lifecycle on Android 16
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'instrumentation' || inputs.mode == 'full') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/amui01'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Provision exact Android/Devtool SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools' 'cmake;3.22.1' 'ndk;27.0.12077973'
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
          if [[ ! -c /dev/kvm ]]; then
            echo '::error::KVM device unavailable for API36 emulator' >&2; exit 1;
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev does not always update the existing device-node permissions
          # before the GitHub runner's next shell command. On this disposable
          # hosted runner, grant the emulator process direct KVM read/write.
          echo "AMUI01_API36_KVM_BEFORE=$(stat -c '%a %U:%G %n' /dev/kvm)"
          id
          sudo chmod 0666 /dev/kvm
          echo "AMUI01_API36_KVM_AFTER=$(stat -c '%a %U:%G %n' /dev/kvm)"
          test -r /dev/kvm && test -w /dev/kvm || {
            echo '::error::KVM inaccessible for API36 emulator' >&2; exit 1;
          }
      - name: API36 real installed/removed package acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: 'false'
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: AMUI01_EXPECT_API=36 bash scripts/devtool/amui01_hosted_instrumentation.sh && AMUI02_EXPECT_API=36 bash scripts/devtool/amui02_hosted_theme.sh
      - name: Upload exact API36 lifecycle receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appmanager-amui01-api36-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/amui01-*.json
            ${{ runner.temp }}/amui01-fixture.sha256
            ${{ runner.temp }}/amui02-*.json
            ${{ runner.temp }}/amui03c-ui-*.json
            ${{ runner.temp }}/amui03c-ui-*.log
            ${{ runner.temp }}/amui04a-api*.json
            ${{ runner.temp }}/amui04a-api*.log
            ${{ runner.temp }}/amui04a-screenshots-api*/**
            ${{ runner.temp }}/amui04a-screenshots-api*.sha256
            ${{ runner.temp }}/amui04b-api*.json
            ${{ runner.temp }}/amui04b-api*.log
            ${{ runner.temp }}/amui04b-screenshots-api*/**
            ${{ runner.temp }}/amui04b-screenshots-api*.sha256
            ${{ runner.temp }}/amui04c-api*.json
            ${{ runner.temp }}/amui04c-api*.log
            ${{ runner.temp }}/amui04d-api*.json
            ${{ runner.temp }}/amui04d-api*.log
            ${{ runner.temp }}/amui01-*.log
          if-no-files-found: error
          retention-days: 7

  amui05-acceptance:
    name: AMUI05 Android API ${{ matrix.api }} acceptance
    needs: [source-contract]
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'instrumentation'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35, 36]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install pinned Devtool (hosted only)
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/Mikeyphw/devtool.git "$RUNNER_TEMP/devtool-source"
          git -C "$RUNNER_TEMP/devtool-source" checkout --detach bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          test "$(git -C "$RUNNER_TEMP/devtool-source" rev-parse HEAD)" = bee6e0b7e49aaaa0c56f755fd5be434a27c52b6c
          python3 -m pip install "$RUNNER_TEMP/devtool-source"
      - name: Verify KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm || { echo 'AMUI05_KVM_REQUIRED' >&2; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-amui05-kvm.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match="kvm"
          sudo chmod 0666 -- /dev/kvm
          [[ -r /dev/kvm && -w /dev/kvm ]]
      - name: Hosted exact-API Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-linux-hw-accel: "false"
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: AMUI05_EXPECT_API=${{ matrix.api }} bash scripts/devtool/amui05_hosted_acceptance.sh
      - name: Upload exact-commit acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amui05-api${{ matrix.api }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/amui05-*.json
            ${{ runner.temp }}/amui05-*.log
          if-no-files-found: error
          retention-days: 14
